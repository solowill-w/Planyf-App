.spi{position:relative;animation:spIn 1s cubic-bezier(.2,.9,.25,1.25) both,spGlow 1.8s ease-out .5s infinite,flt 3.2s ease-in-out 1s infinite!important}
.spi::after{content:'';position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-100%);animation:spShine 1.1s ease-in-out .9s 1 forwards}
#splash.out .spi{animation:spOut .55s cubic-bezier(.5,0,.8,.4) both!important}
#splash.out .sp::after{opacity:0}
@keyframes spIn{0%{opacity:0;transform:scale(.3) rotate(-24deg);filter:blur(8px)}55%{opacity:1;transform:scale(1.14) rotate(5deg);filter:blur(0)}80%{transform:scale(.96) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes spGlow{0%{box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 0 rgba(160,170,255,.5)}100%{box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 38px rgba(160,170,255,0)}}
@keyframes spShine{to{transform:translateX(100%)}}
@keyframes spOut{to{opacity:0;transform:scale(1.7)}}
/* visor de archivos */
.modal.fvm{max-width:min(960px,96vw)}
.fvm .mh h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fview{max-height:64vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:var(--acs);touch-action:pan-x pan-y pinch-zoom}
.fview img{width:100%;display:block}.fview iframe.fv{height:62vh;max-height:none;border-radius:0}
.fmsg{padding:36px 16px;text-align:center;color:var(--mu);font-size:13.5px}.fmsg .fp{margin-bottom:12px}
.fdoc{background:#fff;color:#111;padding:16px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}.fdoc img{max-width:100%}.fdoc table{border-collapse:collapse}.fdoc td,.fdoc th{border:1px solid #ccc;padding:4px 6px}
pre.fdoc{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.fsh{margin:12px 12px 6px;font-size:13px}.ftb{overflow:auto;background:#fff;color:#111;font-size:12.5px}.ftb table{border-collapse:collapse}.ftb td{border:1px solid #ddd;padding:4px 8px;white-space:nowrap}

.ic.thin{stroke-width:1.1!important}
.ri:has(.ic[data-i=cash]),.ri:has(.ic[data-i=receipt]),.ri:has(.ic[data-i=bank]){background:var(--dgs);color:var(--dg)}
.ri:has(.ic[data-i=cal2]){background:var(--bls);color:var(--bl)}
.cd i .ic[data-i=cash]{color:var(--dg)}.cd i .ic[data-i=cal2]{color:var(--bl)}
.tn{display:flex;align-items:center;gap:10px}.tni{display:grid;place-items:center;color:var(--mu);flex:none}.tni .ic{width:18px;height:18px}
.ic.thin{stroke-linecap:round;stroke-linejoin:round}.cd .ic.thin{stroke-width:1.7!important}.addg .ic.thin{stroke-width:1.2!important}
/* ===== animaciones suaves extra ===== */
input,select,textarea{transition:border-color .2s,box-shadow .25s,background-color .35s,color .35s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
.ks-r,.hc3,.ft2,.nn{transition:background .2s,transform .15s ease,border-color .2s}
@media(hover:hover){.card[data-nav]:hover,.hc3:hover,.ft2:hover,.nn:hover{border-color:var(--ac)}}
@keyframes dyin{from{opacity:0;transform:translateY(8px) scale(.9)}}
@keyframes softin{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:no-preference){
.view.enter .dy{animation:dyin .45s cubic-bezier(.2,.9,.3,1.2) backwards}
.view.enter .dy:nth-child(2){animation-delay:.03s}.view.enter .dy:nth-child(3){animation-delay:.06s}.view.enter .dy:nth-child(4){animation-delay:.09s}.view.enter .dy:nth-child(5){animation-delay:.12s}.view.enter .dy:nth-child(6){animation-delay:.15s}.view.enter .dy:nth-child(7){animation-delay:.18s}
.view.enter .ri .ic,.view.enter .tni .ic,.view.enter .hi .ic{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) .2s backwards}
.view.enter .ks-r,.view.enter .hc3,.view.enter .ft2{animation:up .45s cubic-bezier(.2,.8,.2,1) backwards}
.view.enter .ks-r:nth-child(2),.view.enter .ft2:nth-child(2){animation-delay:.05s}.view.enter .ks-r:nth-child(3),.view.enter .ft2:nth-child(3){animation-delay:.1s}.view.enter .ks-r:nth-child(4),.view.enter .ft2:nth-child(4){animation-delay:.15s}.view.enter .ks-r:nth-child(n+5),.view.enter .ft2:nth-child(n+5){animation-delay:.2s}
.view.enter .em{animation:softin .5s ease .25s backwards}
.ov.on .mhi .ic{animation:wob .6s ease .3s}
}
</style>
</head>

<script>
/* ===== Cuenta con Google + saldo de Wive (Supabase) — SOLO LECTURA =====
   Planyf no escribe dinero en la nube: Wive registra los movimientos y Planyf los consulta.
   Sin sesión (o sin datos de Wive) Planyf sigue usando su saldo local de siempre. */
(function(){
  var SB_URL='https://afoluhqnjnsxqzousren.supabase.co';
  var SB_KEY='sb_publishable_Q4AfZVoXg3_CUpVloW8BgA_DMdV-C-o'; /* clave PÚBLICA; la seguridad la dan las políticas RLS */
  var SDK='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  var CK='tablero-cloud-v1', sb=null, pulling=false;

  function cacheLoad(uid){ try{ var c=JSON.parse(localStorage.getItem(CK)); return c&&c.uid===uid?c:null; }catch(e){ return null; } }
  function cacheSave(uid){ try{ localStorage.setItem(CK,JSON.stringify({uid:uid,bal:CB.bal,inc:CB.inc})); }catch(e){} }
  function refresh(){
    try{
      var ae=document.activeElement, typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if(!typing) render(false);
    }catch(e){}
  }

  async function pull(){
    if(!sb||!CB.user||pulling) return;
    pulling=true;
    try{
      var b=await sb.from('planyf_balance').select('saldo_pyg').maybeSingle();
      if(b.error) throw b.error;
      var i=await sb.from('planyf_recent_incomes').select('description,amount,occurred_on')
        .order('occurred_on',{ascending:false}).order('created_at',{ascending:false}).limit(3);
      if(i.error) throw i.error;
      CB.bal=b.data?Number(b.data.saldo_pyg):null;   /* sin datos en Wive => saldo local */
      CB.inc=(i.data||[]).map(function(r){ return {t:r.description||'Ingreso',a:Number(r.amount),d:r.occurred_on}; });
      CB.ok=true; cacheSave(CB.user.id);
    }catch(e){
      console.error('planyf pull',e); CB.ok=false;
      if(CB.bal==null){ var c=cacheLoad(CB.user.id); if(c){ CB.bal=c.bal; CB.inc=c.inc||[]; } }
    }
    pulling=false; refresh();
  }

  window.cloudLogin=async function(){
    if(!sb){ toast('El servicio de cuentas aún está cargando. Probá de nuevo en unos segundos.'); return; }
    try{ localStorage.setItem('tablero-auth','1'); }catch(e){}
    try{
      var r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
      if(r&&r.error) throw r.error;
    }catch(e){ console.error('login',e); toast('No se pudo iniciar sesión con Google'); }
  };
  window.cloudLogout=async function(){ try{ if(sb) await sb.auth.signOut(); }catch(e){} };

  function init(){
    var sc=document.createElement('script'); sc.src=SDK;
    sc.onload=function(){
      try{
        sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
        sb.auth.onAuthStateChange(function(ev,session){
          var u=session?session.user:null;
          if(!u){ CB.user=null; CB.bal=null; CB.inc=[]; CB.ok=false; try{ localStorage.removeItem(CK); }catch(e){} refresh(); return; }
          CB.user=u;
          var c=cacheLoad(u.id); if(c&&CB.bal==null){ CB.bal=c.bal; CB.inc=c.inc||[]; }  /* arranque sin conexión */
          refresh();
          setTimeout(pull,0);
        });
      }catch(e){ console.error('supabase init',e); }
    };
    document.head.appendChild(sc);
  }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') pull(); });
  window.addEventListener('focus',function(){ pull(); });
  window.addEventListener('online',function(){ pull(); });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
